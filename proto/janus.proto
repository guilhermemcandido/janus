syntax = "proto3";

package janus;

option go_package = "github.com/guilhermemcandido/janus/internal/api/proto";

service Exchange {
  rpc SubmitOrder(SubmitOrderRequest) returns (SubmitOrderResponse);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
  rpc GetOrderBook(GetOrderBookRequest) returns (GetOrderBookResponse);
  rpc SubscribeTrades(SubscribeTradesRequest) returns (stream Trade);
  rpc Ping(PingRequest) returns (PingResponse);
  rpc ListSymbols(ListSymbolsRequest) returns (ListSymbolsResponse);
  rpc GetTradeHistory(GetTradeHistoryRequest) returns (GetTradeHistoryResponse);
  rpc RegisterMarket(RegisterMarketRequest) returns (RegisterMarketResponse);
}

enum Side {
  BUY = 0;
  SELL = 1;
}

enum OrderType {
  LIMIT = 0;
  MARKET = 1;
}

message Order {
  uint64 id = 1;
  string symbol = 2;
  Side side = 3;
  OrderType type = 4;
  int64 price = 5;
  uint64 quantity = 6;
  uint64 remaining = 7;
}

message Trade {
  uint64 id = 1;
  string symbol = 2;
  int64 price = 3;
  uint64 quantity = 4;
  uint64 maker_order_id = 5;
  uint64 taker_order_id = 6;
}

message PriceLevel {
  int64 price = 1;
  uint64 quantity = 2;
}

message SubmitOrderRequest {
  string symbol = 1;
  Side side = 2;
  OrderType type = 3;
  int64 price = 4;
  uint64 quantity = 5;
}

message SubmitOrderResponse {
  Order order = 1;
  repeated Trade trades = 2;
}

message CancelOrderRequest {
  string symbol = 1;
  uint64 order_id = 2;
}

message CancelOrderResponse {
  Order order = 1;
}

message GetOrderBookRequest {
  string symbol = 1;
  int32 depth = 2;
}

message GetOrderBookResponse {
  string symbol = 1;
  repeated PriceLevel bids = 2;
  repeated PriceLevel asks = 3;
}

message SubscribeTradesRequest {
  string symbol = 1;
}

message PingRequest {}

message PingResponse {
  uint64 epoch = 1;
}

message MarketSummary {
  string symbol = 1;
  string description = 10;
  bool has_traded = 2;
  int64 last_price = 3;
  int64 open_price = 4;
  int64 high = 5;
  int64 low = 6;
  uint64 volume = 7;
  PriceLevel best_bid = 8;
  PriceLevel best_ask = 9;
}

message ListSymbolsRequest {}

message ListSymbolsResponse {
  repeated MarketSummary markets = 1;
}

message GetTradeHistoryRequest {
  string symbol = 1;
}

message GetTradeHistoryResponse {
  string symbol = 1;
  repeated Trade trades = 2;
}

message RegisterMarketRequest {
  string symbol = 1;
  string description = 2;
}

message RegisterMarketResponse {
  MarketSummary market = 1;
}
